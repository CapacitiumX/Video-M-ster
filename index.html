<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-CUT UNIVERSE | PRO-STUDIO</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk5ldXJhbEN1dCIsCiAgInNob3J0X25hbWUiOiAiTkMiLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImljb25zIjogW3sgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi8zMjIxLzMyMjE4MDUucG5nIiwgInNpemVzIjogIjUxMng1MTIiLCAidHlwZSI6ICJpbWFnZS9wbmciIH1dCn0=">
    <style>
        :root { --neon: #00d2ff; --bg: #0d0d0f; --panel: #16161a; --border: #2d2d33; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: grid; grid-template-rows: 50px 1fr 280px; height: 100vh; overflow: hidden; }
        
        /* HEADER */
        header { background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 800; color: var(--neon); letter-spacing: 1px; }

        /* MAIN WORKSPACE */
        main { display: grid; grid-template-columns: 300px 1fr; gap: 1px; background: var(--border); }
        .sidebar { background: var(--panel); padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        #preview-container { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        canvas { width: 85%; aspect-ratio: 16/9; background: #000; border: 2px solid #333; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        /* TIMELINE */
        footer { background: var(--panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
        .controls { height: 50px; display: flex; align-items: center; padding: 0 20px; gap: 15px; border-bottom: 1px solid #222; }
        .timeline-scroll { flex-grow: 1; overflow-x: auto; position: relative; padding: 15px; background: #0a0a0c; }
        .track { height: 50px; background: #1a1a1f; margin-bottom: 10px; border-radius: 4px; position: relative; border: 1px solid #222; min-width: 5000px; }
        .playhead { position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: #ff3e3e; z-index: 100; pointer-events: none; border-right: 1px solid rgba(255,255,255,0.3); }

        /* CLIPS */
        .clip { position: absolute; height: 40px; top: 5px; background: linear-gradient(90deg, var(--neon), #0072ff); border-radius: 4px; padding: 0 10px; display: flex; align-items: center; font-size: 11px; cursor: pointer; color: #000; font-weight: bold; overflow: hidden; }

        /* UI ELEMENTS */
        .btn { background: var(--neon); color: #000; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-rec { background: #ff4757; color: white; }
        input[type="file"] { display: none; }
        textarea { background: #000; color: var(--neon); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-size: 13px; resize: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">NEURAL-CUT PRO v3.5</div>
    <div>
        <button class="btn" onclick="document.getElementById('fileIn').click()">+ IMPORTAR MEDIA</button>
        <button class="btn" onclick="alert('Exportando Master 4K...')">EXPORTAR</button>
    </div>
</header>

<main>
    <aside class="sidebar">
        <h3>Librería</h3>
        <div id="mediaList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        
        <hr style="border:0; border-top:1px solid #333">
        
        <h3>Clonación de Voz IA</h3>
        <button class="btn btn-rec" id="recBtn" onclick="toggleRecord()">🎙️ GRABAR VOZ PATRÓN</button>
        <textarea id="textToSpeech" rows="4" placeholder="Escribe aquí lo que dirá la IA con TU propia voz..."></textarea>
        <button class="btn" onclick="generateIAVoice()">🔊 GENERAR Y AÑADIR A VIDEO</button>
    </aside>

    <section id="preview-container">
        <canvas id="mainCanvas"></canvas>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button class="btn" onclick="restart()">⏮</button>
            <button class="btn" id="playBtn" onclick="togglePlay()">▶ PLAY</button>
            <button class="btn" onclick="stop()">⏹ STOP</button>
        </div>
    </section>
</main>

<footer>
    <div class="controls">
        <span id="timer" style="font-family: monospace; font-size: 18px; color: var(--neon);">00:00:00</span>
        <small style="color: #666;">DURACIÓN MÁX: 60:00</small>
    </div>
    <div class="timeline-scroll" id="timelineScroll">
        <div class="playhead" id="playhead"></div>
        <div class="track" id="track-video"></div>
        <div class="track" id="track-audio"></div>
    </div>
</footer>

<input type="file" id="fileIn" multiple accept="image/*">

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const playhead = document.getElementById('playhead');
    const timer = document.getElementById('timer');
    
    canvas.width = 1280; canvas.height = 720;
    
    let isPlaying = false;
    let time = 0; // Tiempo en píxeles (1px = 1/10 segundo aprox)
    let timelineAssets = [];
    let isRecording = false;

    // --- IMPORTACIÓN Y LÍNEA DE TIEMPO ---
    document.getElementById('fileIn').onchange = (e) => {
        for (let file of e.target.files) {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.src = url;
            img.onload = () => {
                const clipWidth = 150; // 5 segundos aprox
                const asset = { img, x: time, w: clipWidth, name: file.name };
                timelineAssets.push(asset);
                
                // Crear Clip Visual en Timeline
                const clipUI = document.createElement('div');
                clipUI.className = 'clip';
                clipUI.style.left = asset.x + "px";
                clipUI.style.width = asset.w + "px";
                clipUI.innerText = file.name;
                document.getElementById('track-video').appendChild(clipUI);
                
                draw(); // Refrescar canvas
            };
        }
    };

    // --- MOTOR DE RENDERIZADO ---
    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Buscar qué imagen debe mostrarse según el cabezal (time)
        timelineAssets.forEach(asset => {
            if (time >= asset.x && time <= (asset.x + asset.w)) {
                ctx.drawImage(asset.img, 0, 0, canvas.width, canvas.height);
            }
        });

        if (isPlaying) {
            time += 2; // Velocidad del playhead
            playhead.style.left = time + "px";
            updateClock();
            requestAnimationFrame(draw);
        }
    }

    function updateClock() {
        const totalSeconds = Math.floor(time / 20);
        const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const secs = (totalSeconds % 60).toString().padStart(2, '0');
        timer.innerText = `00:${mins}:${secs}`;
    }

    // --- CONTROLES DE REPRODUCCIÓN ---
    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "⏸ PAUSE" : "▶ PLAY";
        if (isPlaying) draw();
    }

    function stop() { isPlaying = false; time = 0; playhead.style.left = "0"; draw(); }
    function restart() { time = 0; playhead.style.left = "0"; if(!isPlaying) draw(); }

    // --- CLONACIÓN DE VOZ IA (Simulada con Web Speech API + Voice Profile) ---
    function toggleRecord() {
        isRecording = !isRecording;
        const btn = document.getElementById('recBtn');
        if (isRecording) {
            btn.innerText = "🔴 GRABANDO TU TONO...";
            // Aquí se activaría el MediaRecorder para capturar la muestra de voz
        } else {
            btn.innerText = "✅ VOZ ANALIZADA";
            btn.style.background = "#00d2ff";
        }
    }

    function generateIAVoice() {
        const text = document.getElementById('textToSpeech').value;
        if (!text) return alert("Escribe un texto primero");

        const msg = new SpeechSynthesisUtterance(text);
        // Aquí se aplicaría el "Pitch" y "Rate" basado en la voz grabada
        msg.pitch = 1.2; 
        msg.rate = 0.9;
        
        // Añadir bloque de audio a la línea de tiempo
        const audioClip = document.createElement('div');
        audioClip.className = 'clip';
        audioClip.style.background = '#00ff88';
        audioClip.style.left = time + "px";
        audioClip.style.width = (text.length * 5) + "px";
        audioClip.innerText = "IA VOICE: " + text.substring(0,10) + "...";
        document.getElementById('track-audio').appendChild(audioClip);

        window.speechSynthesis.speak(msg);
    }

    // Inicialización
    draw();
</script>
</body>
</html>
