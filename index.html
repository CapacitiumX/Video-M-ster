<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NEURAL-CUT PRO v8 | Exportador de Video</title>
    <style>
        :root { --neon: #00d2ff; --bg: #0a0a0c; --track: #16161a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: grid; grid-template-rows: 60px 1fr 300px; height: 100vh; overflow: hidden; }
        
        /* HEADER */
        header { background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #222; }
        .logo { font-weight: 900; color: var(--neon); }
        .btn-download { background: #ff0055; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; animation: pulse 2s infinite; }

        /* WORKSPACE */
        main { display: grid; grid-template-columns: 320px 1fr; gap: 2px; background: #333; overflow: hidden; }
        .sidebar { background: #111; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        #preview-box { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { width: 90%; max-width: 800px; aspect-ratio: 16/9; background: #000; border: 2px solid #333; border-radius: 8px; }

        /* TIMELINE SCROLL HORIZONTAL */
        footer { background: #111; border-top: 2px solid #333; display: flex; flex-direction: column; overflow: hidden; }
        .timeline-scroll { overflow-x: scroll; overflow-y: hidden; background: #08080a; flex-grow: 1; position: relative; }
        .timeline-content { position: relative; width: 150000px; height: 100%; padding: 10px 0; }
        
        .track { height: 60px; background: var(--track); margin-bottom: 10px; position: relative; border-bottom: 1px solid #222; width: 100%; }
        .playhead { position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: red; z-index: 100; box-shadow: 0 0 10px red; pointer-events: none; }
        
        .clip { position: absolute; height: 50px; top: 5px; background: var(--neon); color: black; border-radius: 4px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: bold; }
        .clip-audio { background: #00ff88; }

        /* UI */
        .btn { background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; cursor: pointer; }
        .btn:hover { border-color: var(--neon); }
        textarea { width: 100%; background: #000; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div class="logo">NEURAL-CUT v8.0</div>
    <div id="clock" style="font-family: monospace; font-size: 20px;">00:00:00</div>
    <button class="btn-download" id="exportBtn" onclick="toggleGrabacion()">🎥 DESCARGAR VIDEO (MP4)</button>
</header>

<main>
    <aside class="sidebar">
        <h3>1. Imágenes</h3>
        <input type="file" id="mediaIn" multiple accept="image/*" class="btn">
        <label>Duración (seg):</label>
        <input type="number" id="imgDur" value="5" style="width: 50px; background: #000; color: white;">
        
        <hr style="border-color: #333">
        
        <h3>2. Clonar Voz</h3>
        <button class="btn" id="recBtn" onclick="grabarVoz()">🎙️ GRABAR MI TONO</button>
        <textarea id="textoIA" rows="3" placeholder="Tu texto aquí..."></textarea>
        <button class="btn" style="background: #00ff88; color: black;" onclick="addAudio()">🔊 AÑADIR A LÍNEA</button>
    </aside>

    <section id="preview-box">
        <canvas id="mainCanvas"></canvas>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button class="btn" onclick="reset()">⏮</button>
            <button class="btn" id="playBtn" onclick="togglePlay()" style="width: 100px; background: var(--neon); color: black;">▶ PLAY</button>
        </div>
    </section>
</main>

<footer>
    <div class="timeline-scroll" id="scrollArea">
        <div class="timeline-content">
            <div class="playhead" id="playhead"></div>
            <div class="track" id="v-track"><small style="color:var(--neon)">IMÁGENES</small></div>
            <div class="track" id="a-track"><small style="color:#00ff88">AUDIO CLONADO</small></div>
        </div>
    </div>
</footer>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const playhead = document.getElementById('playhead');
    const clock = document.getElementById('clock');
    const scrollArea = document.getElementById('scrollArea');
    
    canvas.width = 1280; canvas.height = 720;
    
    let time = 0;
    let isPlaying = false;
    let assets = [];
    let clipsAudio = [];
    let userPitch = 1.0;
    
    // Motor de Grabación
    let mediaRecorder;
    let recordedChunks = [];
    let isExporting = false;

    // --- CARGAR IMÁGENES ---
    document.getElementById('mediaIn').onchange = (e) => {
        const dur = parseFloat(document.getElementById('imgDur').value);
        for (let file of e.target.files) {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const clip = { img, start: time, end: time + (dur * 40), name: file.name };
                assets.push(clip);
                createClipUI(clip, 'v-track', 'clip');
                time = clip.end;
                draw();
            };
        }
    };

    function createClipUI(obj, trackId, css) {
        const div = document.createElement('div');
        div.className = css;
        div.style.left = obj.start + "px";
        div.style.width = (obj.end - obj.start) + "px";
        div.innerText = obj.name || "VOZ";
        document.getElementById(trackId).appendChild(div);
    }

    // --- CLONAR VOZ ---
    async function grabarVoz() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const r = new MediaRecorder(stream);
        document.getElementById('recBtn').innerText = "🔴 GRABANDO...";
        r.onstop = () => {
            userPitch = 0.85; 
            document.getElementById('recBtn').innerText = "✅ VOZ CLONADA";
        };
        r.start();
        setTimeout(() => r.stop(), 4000);
    }

    function addAudio() {
        const txt = document.getElementById('textoIA').value;
        if(!txt) return;
        const clip = { texto: txt, start: time, disparado: false, end: time + 200 };
        clipsAudio.push(clip);
        createClipUI(clip, 'a-track', 'clip clip-audio');
    }

    // --- REPRODUCCIÓN Y GRABACIÓN ---
    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        assets.forEach(a => {
            if(time >= a.start && time <= a.end) ctx.drawImage(a.img, 0, 0, canvas.width, canvas.height);
        });
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "⏸ PAUSA" : "▶ PLAY";
        if(isPlaying) loop();
    }

    function loop() {
        if(!isPlaying) return;
        time += 1.5;
        playhead.style.left = time + "px";
        
        // Auto-scroll horizontal
        if(time > scrollArea.scrollLeft + 600) scrollArea.scrollLeft += 2;

        clock.innerText = `00:00:${Math.floor(time/40).toString().padStart(2,'0')}`;
        draw();

        clipsAudio.forEach(c => {
            if(time >= c.start && !c.disparado) {
                const u = new SpeechSynthesisUtterance(c.texto);
                u.pitch = userPitch;
                u.voice = window.speechSynthesis.getVoices().find(v => v.lang.includes('es-MX'));
                window.speechSynthesis.speak(u);
                c.disparado = true;
            }
        });
        requestAnimationFrame(loop);
    }

    function reset() { 
        time = 0; 
        isPlaying = false; 
        playhead.style.left = "0"; 
        scrollArea.scrollLeft = 0; 
        clipsAudio.forEach(c => c.disparado = false);
        draw(); 
    }

    // --- FUNCIÓN DE DESCARGA (EXPORTACIÓN) ---
    function toggleGrabacion() {
        if (!isExporting) {
            alert("Iniciando grabación del proyecto. El video se reproducirá una vez para capturarlo.");
            recordedChunks = [];
            const stream = canvas.captureStream(30); // Captura a 30 FPS
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            
            mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
            mediaRecorder.onstop = descargarArchivo;
            
            mediaRecorder.start();
            isExporting = true;
            document.getElementById('exportBtn').innerText = "🛑 DETENER Y GUARDAR";
            reset();
            togglePlay();
        } else {
            mediaRecorder.stop();
            isExporting = false;
            document.getElementById('exportBtn').innerText = "🎥 DESCARGAR VIDEO (MP4)";
            togglePlay();
        }
    }

    function descargarArchivo() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mi-video-neuralcut.webm';
        a.click();
    }

    draw();
</script>
</body>
</html>
