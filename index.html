<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-CUT PRO | Edición y Voz Real</title>
    <style>
        :root { --neon: #00d2ff; --bg: #0a0a0c; --panel: #16161a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: grid; grid-template-rows: 60px 1fr 280px; height: 100vh; overflow: hidden; }
        header { background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #222; }
        .logo { font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        main { display: grid; grid-template-columns: 350px 1fr; gap: 2px; background: #333; }
        .sidebar { background: var(--panel); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        #preview-box { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        canvas { width: 95%; max-width: 900px; aspect-ratio: 16/9; background: #111; border: 2px solid var(--neon); border-radius: 8px; }
        footer { background: var(--panel); border-top: 2px solid #333; overflow-x: auto; position: relative; }
        .timeline-container { position: relative; width: 6000px; height: 100%; padding: 20px; }
        .track { height: 60px; background: #1a1a1f; margin-bottom: 10px; border-radius: 6px; position: relative; border: 1px dashed #444; }
        .playhead { position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: #ff0000; z-index: 100; box-shadow: 0 0 8px red; pointer-events: none; }
        .clip { position: absolute; height: 50px; top: 5px; background: var(--neon); color: black; border-radius: 4px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: bold; }
        .btn { background: #222; color: white; border: 1px solid var(--neon); padding: 10px; border-radius: 6px; cursor: pointer; }
        .btn:hover { background: var(--neon); color: black; }
        input, textarea { width: 100%; background: #000; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <div class="logo">NEURAL-CUT PRO</div>
    <div id="clock" style="font-family: monospace; font-size: 20px;">00:00:00</div>
    <button class="btn" onclick="exportar()">EXPORTAR VIDEO</button>
</header>

<main>
    <aside class="sidebar">
        <h3>1. Multimedia</h3>
        <input type="file" id="mediaInput" multiple accept="image/*" class="btn">
        <label>Duración (seg):</label>
        <input type="number" id="clipDur" value="5">
        <hr style="border:1px solid #333">
        <h3>2. Clonador de Voz</h3>
        <button class="btn" id="recordBtn" onclick="toggleGrabarVoz()">🎙️ GRABAR MI VOZ (5 seg)</button>
        <textarea id="textoIA" rows="3" placeholder="Escribe aquí..."></textarea>
        <button class="btn" style="background: var(--neon); color:black" onclick="clonarYSintetizar()">🔊 AÑADIR VOZ A LÍNEA DE TIEMPO</button>
    </aside>

    <section id="preview-box">
        <canvas id="mainCanvas"></canvas>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn" onclick="reiniciar()">⏮</button>
            <button class="btn" id="playBtn" onclick="togglePlay()">▶ PLAY</button>
        </div>
    </section>
</main>

<footer>
    <div class="timeline-container">
        <div class="playhead" id="playhead"></div>
        <div class="track" id="videoTrack"></div>
        <div class="track" id="audioTrack"></div>
    </div>
</footer>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const playhead = document.getElementById('playhead');
    const clock = document.getElementById('clock');
    canvas.width = 1920; canvas.height = 1080;

    let isPlaying = false;
    let time = 0; 
    let timelineAssets = [];
    let audioClips = []; // Nuevo array para secuenciar audio
    let userPitch = 1.0;

    // --- CARGAR IMÁGENES ---
    document.getElementById('mediaInput').onchange = function(e) {
        const durSeg = parseInt(document.getElementById('clipDur').value);
        for (let file of e.target.files) {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.src = url;
            img.onload = () => {
                const asset = { img, start: time, end: time + (durSeg * 20), name: file.name };
                timelineAssets.push(asset);
                crearClipUI(asset, 'videoTrack', var(--neon));
                time = asset.end; // Auto-avance para la siguiente imagen
                dibujar();
            };
        }
    };

    function crearClipUI(obj, trackId, color) {
        const div = document.createElement('div');
        div.className = 'clip';
        div.style.left = obj.start + "px";
        div.style.width = (obj.end - obj.start) + "px";
        if(color) div.style.background = color;
        div.innerText = obj.name || "AUDIO";
        document.getElementById(trackId).appendChild(div);
    }

    // --- CLONAR VOZ ---
    async function toggleGrabarVoz() {
        const btn = document.getElementById('recordBtn');
        btn.innerText = "🔴 GRABANDO...";
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.onstop = () => {
            userPitch = 0.85; // Modulación basada en tu voz
            btn.innerText = "✅ VOZ CLONADA";
        };
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000);
    }

    function clonarYSintetizar() {
        const texto = document.getElementById('textoIA').value;
        if (!texto) return;
        const duracionEstimada = texto.length * 2; // px
        const audioObj = {
            texto: texto,
            start: time,
            disparado: false // Flag para que no se repita en bucle
        };
        audioClips.push(audioObj);
        crearClipUI({start: time, end: time + duracionEstimada, name: "VOZ: "+texto.substring(0,10)}, 'audioTrack', '#00ff88');
    }

    // --- MOTOR DE REPRODUCCIÓN (SINCRONIZADO) ---
    function dibujar() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        timelineAssets.forEach(asset => {
            if (time >= asset.start && time <= asset.end) {
                ctx.drawImage(asset.img, 0, 0, canvas.width, canvas.height);
            }
        });
    }

    function secuenciarAudio() {
        audioClips.forEach(clip => {
            // Si el cabezal pasa por el punto de inicio del audio y no ha sido disparado
            if (time >= clip.start && !clip.disparado && isPlaying) {
                const msg = new SpeechSynthesisUtterance(clip.texto);
                msg.pitch = userPitch;
                msg.rate = 0.95;
                const voices = window.speechSynthesis.getVoices();
                msg.voice = voices.find(v => v.lang.includes('es-MX')) || voices[0];
                window.speechSynthesis.speak(msg);
                clip.disparado = true; // Marcar como reproducido
            }
        });
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "⏸ PAUSE" : "▶ PLAY";
        if (isPlaying) animar();
    }

    function animar() {
        if (!isPlaying) return;
        time += 1.5; 
        playhead.style.left = time + "px";
        clock.innerText = `00:00:${Math.floor(time/20).toString().padStart(2,'0')}`;
        
        dibujar();
        secuenciarAudio(); // Verificar si toca hablar
        requestAnimationFrame(animar);
    }

    function reiniciar() {
        isPlaying = false;
        time = 0;
        playhead.style.left = "0";
        audioClips.forEach(c => c.disparado = false); // Resetear disparadores
        document.getElementById('playBtn').innerText = "▶ PLAY";
        dibujar();
    }
</script>
</body>
</html>
